# One command brings the whole stack up, migrated and seeded:
#
#   docker compose up --build
#
# Host ports are deliberately non-standard so this stack can run alongside
# others: API 8210, PostgreSQL 8211, Redis 8212. Every value below can be
# overridden from a .env file in this directory.

name: library-tracking

x-django-env: &django-env
  DEBUG: "${DEBUG:-0}"
  SECRET_KEY: "${SECRET_KEY:-compose-demo-key-not-for-production}"
  DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost 127.0.0.1 [::1] web}"
  DB_ENGINE: django.db.backends.postgresql
  POSTGRES_DB: "${POSTGRES_DB:-library_db}"
  POSTGRES_USER: "${POSTGRES_USER:-library_user}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-library_password}"
  DB_HOST: db
  DB_PORT: "5432"
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  DEFAULT_FROM_EMAIL: "${DEFAULT_FROM_EMAIL:-admin@library.com}"
  OVERDUE_NOTIFICATION_BATCH_SIZE: "${OVERDUE_NOTIFICATION_BATCH_SIZE:-500}"
  LOG_LEVEL: "${LOG_LEVEL:-INFO}"

x-app: &app
  build:
    context: .
  image: library-tracking:local
  environment: *django-env
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-library_db}"
      POSTGRES_USER: "${POSTGRES_USER:-library_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-library_password}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "8211:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-library_user} -d ${POSTGRES_DB:-library_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "8212:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    <<: *app
    ports:
      - "8210:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    <<: *app
    # The web service owns migrations and seeding; the workers just consume.
    environment:
      <<: *django-env
      RUN_MIGRATIONS: "0"
      RUN_SEED: "0"
    command: ["celery", "-A", "library_system", "worker", "-l", "info"]
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A library_system inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  beat:
    <<: *app
    environment:
      <<: *django-env
      RUN_MIGRATIONS: "0"
      RUN_SEED: "0"
    command:
      - celery
      - -A
      - library_system
      - beat
      - -l
      - info
      - --schedule
      - /tmp/celerybeat-schedule
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      # Not `pgrep`: procps is absent from python:*-slim, so a pgrep-based
      # check reports unhealthy even while beat is running. See the script.
      test: ["CMD", "python", "/app/docker/healthcheck_beat.py"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
